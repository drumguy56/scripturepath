<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the first paint so the page never shows
      // the wrong background for a frame. Mirrors next-themes' storage key and
      // its dark default.
      (function () {
        try {
          // Dark unless the reader has explicitly chosen light.
          document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('theme') !== 'light'
          );
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/media/57f3a7272_generated_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>ScripturePath</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
